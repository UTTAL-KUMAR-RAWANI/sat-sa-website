version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sat_sa_postgres
    environment:
      POSTGRES_USER: sat_sa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sat_sa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sat_sa -d sat_sa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sat_sa_backend
    environment:
      DATABASE_URL: postgresql+psycopg://sat_sa:password@postgres:5432/sat_sa
      JWT_SECRET: demo-jwt-secret-key-sat-sa-platform-2026
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sat_sa_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
